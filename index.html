<!DOCTYPE html>
<html>
<head>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #000; 
    }
    iframe { 
      width: 100vw; 
      height: 100vh; 
      border: 0; 
    }
  </style>
</head>
<body>
  <iframe 
    src="https://docs.google.com/presentation/d/e/2PACX-1vSWuDpXzfHh3slyE49QlKKRJ3ttVdzbv6f3wm88mCe1KcwjfegXO1VdvSQJFwjzMRAm10RaHanaMGai/pubembed?start=true&loop=true&delayms=5000&rm=minimal" 
    allowfullscreen="true" 
    mozallowfullscreen="true" 
    webkitallowfullscreen="true">
  </iframe>
</body>
</html>
