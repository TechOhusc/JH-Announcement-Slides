<html>

    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000; 
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>
  <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSWuDpXzfHh3slyE49QlKKRJ3ttVdzbv6f3wm88mCe1KcwjfegXO1VdvSQJFwjzMRAm10RaHanaMGai/pub?start=true&loop=true&delayms=3000"></iframe>
</body>
</html>
